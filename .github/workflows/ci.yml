name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-quality:
    name: Linux CPU quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.10
      - name: Sync Linux CPU environment
        run: uv sync --python 3.10 --frozen --group dev --extra cpu
      - name: Run tests
        run: uv run --frozen --python 3.10 --group dev --extra cpu pytest -q
      - name: Report THRML compatibility status
        run: uv run --frozen --python 3.10 --group dev --extra cpu python tools/parity_report.py
      - name: Check formatting
        run: uv run --frozen --python 3.10 --group dev --extra cpu ruff format --check .
      - name: Lint
        run: uv run --frozen --python 3.10 --group dev --extra cpu ruff check .
      - name: Type check
        run: uv run --frozen --python 3.10 --group dev --extra cpu ty check src
      - name: Build distributions
        run: uv build
      - name: Smoke-test wheel with Linux CPU MLX
        run: uv run --isolated --no-project --with "mlx[cpu]>=0.32,<0.33" --with ./dist/thrmlx-0.1.0-py3-none-any.whl python -c "import thrmlx; print(thrmlx.__version__)"

  apple-silicon:
    name: Apple Silicon correctness and package
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync environment
        run: uv sync --frozen --group dev
      - name: Run tests
        run: uv run --frozen --group dev pytest -q
      - name: Report THRML compatibility status
        run: uv run --frozen --group dev python tools/parity_report.py
      - name: Check formatting
        run: uv run --frozen --group dev ruff format --check .
      - name: Lint
        run: uv run --frozen --group dev ruff check .
      - name: Type check
        run: uv run --frozen --group dev ty check src
      - name: Run example
        run: uv run --frozen --group dev python examples/two_spin.py
      - name: Run THRML-style block-state example
        run: uv run --frozen --group dev python examples/block_state_round_trip.py
      - name: Run THRML-style generic sampling example
        run: uv run --frozen --group dev python examples/generic_block_sampling.py
      - name: Run THRML-style factor sampling example
        run: uv run --frozen --group dev python examples/factor_sampling.py
      - name: Run THRML-style discrete EBM example
        run: uv run --frozen --group dev python examples/discrete_ebm.py
      - name: Run THRML-style Ising example
        run: uv run --frozen --group dev python examples/thrml_ising.py
      - name: Run compact MNIST-shaped training fixture
        run: uv run --frozen --group dev python examples/train_mnist_fixture.py
      - name: Build distributions
        run: uv build
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with ./dist/thrmlx-0.1.0-py3-none-any.whl python -c "import thrmlx; print(thrmlx.__version__)"
